# Prüft Pull Requests: HTML-Validierung und Browser-Smoke-Test
name: Seiten prüfen

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Werkzeuge installieren
        run: |
          npm install --no-save --no-audit --no-fund html-validate@11 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: HTML validieren
        run: npx html-validate 002-neon-rain.html index.html
      - name: Browser-Smoke-Test
        run: node tests/smoke.cjs
